<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADHD Self-Check</title>
<meta name="description" content="A free, private 5-minute adult ADHD self-screening based on the WHO Adult ADHD Self-Report Scale (ASRS v1.1) and DSM-5 criteria, with guidance for getting assessed in India.">
<meta property="og:title" content="ADHD Self-Check — 5-minute adult screening">
<meta property="og:description" content="Based on the WHO ASRS v1.1 screener. Private — nothing leaves your device.">
<meta name="theme-color" content="#f6f3ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --surface:#ffffff; --ink:#1d1b18; --muted:#6b655c; --line:#e4ded4;
  --accent:#3b5bdb; --accent-ink:#ffffff; --accent-soft:#e7ecfd;
  --low:#2f9e6b; --mid:#d9822b; --high:#c2410c;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141412; --surface:#1e1d1a; --ink:#f1ede6; --muted:#a39d93; --line:#33302b;
    --accent:#7c94f5; --accent-ink:#0f1222; --accent-soft:#232945;
    --low:#4cc38a; --mid:#f0a050; --high:#f27a4a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1e1d1a; --ink:#f1ede6; --muted:#a39d93; --line:#33302b;
  --accent:#7c94f5; --accent-ink:#0f1222; --accent-soft:#232945;
  --low:#4cc38a; --mid:#f0a050; --high:#f27a4a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:400 17px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
h1,h2,.q-title{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* p5 background */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg canvas{display:block}
.stage{position:relative;z-index:1}
.q-title,.lead,.q-hint,h1{text-shadow:0 0 18px var(--bg),0 0 6px var(--bg)}

/* progress */
.progress{position:fixed;inset:0 0 auto 0;height:4px;background:var(--line);z-index:10}
.progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .45s cubic-bezier(.2,.8,.2,1)}

.topbar{position:fixed;top:4px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;z-index:9;pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{font-weight:600;font-size:14px;letter-spacing:.02em;color:var(--muted)}
.counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* stage */
.stage{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:84px 16px 110px}
.card{width:100%;max-width:680px}
.anim-in{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.anim-out-up{animation:outUp .28s ease both}
.anim-out-down{animation:outDown .28s ease both}
.anim-in-rev{animation:inRev .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes inRev{from{opacity:0;transform:translateY(-36px)}to{opacity:1;transform:none}}
@keyframes outUp{to{opacity:0;transform:translateY(-36px)}}
@keyframes outDown{to{opacity:0;transform:translateY(36px)}}
@media (prefers-reduced-motion: reduce){.anim-in,.anim-in-rev,.anim-out-up,.anim-out-down{animation:none}}

.eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:14px;margin-bottom:14px}
.eyebrow .num{display:inline-flex;align-items:center;gap:6px}
.q-title{font-size:clamp(24px,4.2vw,34px);line-height:1.22}
.q-hint{color:var(--muted);margin:12px 0 0;font-size:15.5px}
.lead{font-size:clamp(18px,2.4vw,20px);color:var(--muted);margin:18px 0 0}
h1{font-size:clamp(34px,6.5vw,54px);line-height:1.08}

/* options */
.options{display:grid;gap:10px;margin-top:28px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 16px;font-size:17px;transition:border-color .15s,background .15s,transform .1s;
}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.99)}
.opt .key{
  flex:none;width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);background:var(--bg)
}
.opt .lbl{flex:1}
.opt .tick{opacity:0;color:var(--accent);font-weight:700;transition:opacity .15s}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.selected .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.selected .tick{opacity:1}
.opt.flash{animation:flash .32s ease}
@keyframes flash{0%,100%{background:var(--accent-soft)}50%{background:var(--surface)}}

.actions{display:flex;align-items:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:10px;border:0;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);padding:13px 22px;font-weight:600;font-size:16.5px;
  box-shadow:var(--shadow);transition:transform .1s,filter .15s
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.kbd-hint{font-size:13px;color:var(--muted)}
.kbd-hint b{font-weight:600}

.note{margin-top:28px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;color:var(--muted)}
.note strong{color:var(--ink)}
.meta-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:14.5px}
.meta-row span{display:inline-flex;align-items:center;gap:6px}

/* nav */
.nav{position:fixed;right:16px;bottom:16px;display:flex;gap:6px;z-index:9}
.nav button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.nav button[disabled]{opacity:.35;cursor:default}
.nav svg{width:18px;height:18px}

/* results */
.result-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.gauge{flex:none;width:132px;height:132px;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .val b{font-family:Fraunces,serif;font-size:34px;font-weight:600;line-height:1}
.gauge .val small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;color:#fff}
.section{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.section h2{font-size:22px;margin-bottom:10px}
.section p{margin:8px 0}
.section ul{margin:8px 0;padding-left:20px}
.section li{margin:6px 0}
.bar-row{margin:14px 0}
.bar-row .top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.bar-row .top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--line);border-radius:6px;position:relative;overflow:visible}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--accent);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
.legend{font-size:13px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--bg);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:Fraunces,serif;font-size:26px;font-weight:600}
.stat span{font-size:13.5px;color:var(--muted)}
.help{border-left:4px solid var(--accent)}
.sources{font-size:13.5px;color:var(--muted)}
.sources li{margin:4px 0}
.sources a{color:var(--muted)}
a{color:var(--accent)}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;transition:transform .3s;z-index:20}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:560px){
  body{font-size:16px}
  .stage{align-items:flex-start;padding-top:72px}
  .grid2{grid-template-columns:1fr}
  .kbd-hint{display:none}
  .opt{padding:13px 14px}
}
@media print{
  .progress,.topbar,.nav,.res-actions,.toast,#bg{display:none!important}
  body{background:#fff;color:#000}
  .section{box-shadow:none;break-inside:avoid}
  .stage{padding:0;min-height:0}
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<header class="topbar">
  <div class="brand">ADHD Self-Check</div>
  <div class="counter" id="counter" aria-live="polite"></div>
</header>

<main class="stage"><div class="card" id="card" role="region" aria-live="polite"></div></main>

<nav class="nav" aria-label="Question navigation">
  <button id="prevBtn" aria-label="Previous question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg></button>
  <button id="nextBtn" aria-label="Next question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
/*
 * Screening content: WHO Adult ADHD Self-Report Scale (ASRS v1.1), 18-item Symptom Checklist.
 * Kessler RC, Adler L, Ames M, et al. Psychological Medicine 2005;35(2):245–256.
 * "Shaded" (clinically significant) thresholds follow the official ASRS v1.1 checklist:
 *   items 1,2,3,9,12,16,18 → "Sometimes" or higher; all other items → "Often" or higher.
 * Part A (items 1–6) is the screener: 4+ shaded = highly consistent with adult ADHD.
 * Domain mapping follows DSM-5: inattention = 1–4, 7–11; hyperactivity/impulsivity = 5, 6, 12–18.
 */
const FREQ = ["Never","Rarely","Sometimes","Often","Very often"];
const LOW_THRESHOLD = new Set([1,2,3,9,12,16,18]);

const ASRS = [
  {t:"How often do you have trouble wrapping up the final details of a project, once the challenging parts have been done?", h:"e.g. the last slides of an office presentation, final formatting of a college assignment, filing that last form."},
  {t:"How often do you have difficulty getting things in order when you have to do a task that requires organisation?", h:"e.g. planning a family function, organising documents for a visa or loan, managing a work project."},
  {t:"How often do you have problems remembering appointments or obligations?", h:"e.g. doctor visits, bill due dates, calls you promised to make, deadlines."},
  {t:"When you have a task that requires a lot of thought, how often do you avoid or delay getting started?", h:"e.g. exam preparation, writing a report, filing taxes."},
  {t:"How often do you fidget or squirm with your hands or feet when you have to sit for a long time?", h:"e.g. in long meetings, lectures, train or bus journeys, religious functions."},
  {t:"How often do you feel overly active and compelled to do things, like you were driven by a motor?", h:"A restless inner drive that's hard to switch off."},
  {t:"How often do you make careless mistakes when you have to work on a boring or difficult project?", h:"e.g. typos, calculation slips, missing a step you know well."},
  {t:"How often do you have difficulty keeping your attention when you are doing boring or repetitive work?", h:"e.g. data entry, reading long documents, routine paperwork."},
  {t:"How often do you have difficulty concentrating on what people say to you, even when they are speaking to you directly?", h:"Drifting off mid-conversation, even when you want to listen."},
  {t:"How often do you misplace or have difficulty finding things at home or at work?", h:"e.g. keys, phone, wallet, glasses, important papers."},
  {t:"How often are you distracted by activity or noise around you?", h:"e.g. traffic, conversations nearby, notifications, people moving around."},
  {t:"How often do you leave your seat in meetings or other situations in which you are expected to remain seated?", h:"e.g. classes, meetings, ceremonies, waiting rooms."},
  {t:"How often do you feel restless or fidgety?", h:"A physical or mental sense of not being able to settle."},
  {t:"How often do you have difficulty unwinding and relaxing when you have time to yourself?", h:"e.g. on weekends or holidays, your mind or body keeps going."},
  {t:"How often do you find yourself talking too much when you are in social situations?", h:"Others may have commented on it."},
  {t:"When you're in a conversation, how often do you find yourself finishing the sentences of the people you are talking to, before they can finish them themselves?", h:""},
  {t:"How often do you have difficulty waiting your turn in situations when turn-taking is required?", h:"e.g. queues, traffic, group discussions."},
  {t:"How often do you interrupt others when they are busy?", h:""},
];

/* Build the flow */
const steps = [];
steps.push({type:"intro"});
steps.push({type:"choice", id:"age", t:"First, how old are you?", h:"The ASRS is validated for adults. Children and teenagers need a parent/teacher-based assessment.",
  opts:["18 or older","Under 18"]});
steps.push({type:"interstitial", id:"partA", title:"Part A · The 6-question screener", body:"These six questions are the core WHO screener. Think about how you have felt and behaved <strong>over the past 6 months</strong>.", cta:"Let's go"});
ASRS.forEach((q,i)=>{
  if(i===6) steps.push({type:"interstitial", id:"partB", title:"Nice — you're a third of the way.", body:"Part B has 12 more questions. They help describe your pattern of attention and activity in more detail.", cta:"Continue"});
  steps.push({type:"asrs", idx:i, id:"q"+(i+1), t:q.t, h:q.h, opts:FREQ});
});
steps.push({type:"interstitial", id:"ctx", title:"Almost done — a little context.", body:"A clinician diagnosing ADHD (per DSM-5 / ICD-11) looks beyond symptoms: when they began, where they show up, and how much they affect your life.", cta:"Continue"});
steps.push({type:"choice", id:"onset", t:"Were several of these difficulties present before you were 12 years old?", h:"Think of school reports, teachers' remarks, or what your parents say about you as a child.", opts:["Yes, clearly","Probably / some of them","I'm not sure","No — they started later"]});
steps.push({type:"choice", id:"settings", t:"In how many areas of life do these difficulties show up?", h:"e.g. home, work or college, friendships, relationships.", opts:["Only one area","Two areas","Three or more areas"]});
steps.push({type:"choice", id:"impact", t:"How much do these difficulties interfere with your work, studies, finances or relationships?", h:"", opts:["Not at all","A little","Moderately","Severely"]});
steps.push({type:"multi", id:"other", t:"Do any of these currently apply to you?", h:"Select all that apply. These can cause or overlap with attention problems, so a clinician will check them too.",
  opts:["Poor or irregular sleep","Low mood or loss of interest for 2+ weeks","Frequent worry or anxiety","Regular alcohol, cannabis or other substance use","Thyroid or other medical condition","None of these"]});
steps.push({type:"results"});

const answers = {};
let cur = 0, busy = false;
const card = document.getElementById("card");
const totalQs = steps.filter(s=>["choice","asrs","multi"].includes(s.type)).length;

function qNumber(i){ let n=0; for(let k=0;k<=i;k++) if(["choice","asrs","multi"].includes(steps[k].type)) n++; return n; }
const LETTERS = "ABCDEFGH";
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(dir=1){
  const s = steps[cur];
  let html = "";
  if(s.type==="intro"){
    html = `
      <div class="eyebrow">Free · Private · ~5 minutes</div>
      <h1>Could it be ADHD?</h1>
      <p class="lead">A short self-check built on the <strong>WHO Adult ADHD Self-Report Scale (ASRS v1.1)</strong> — the same screener used by psychiatrists worldwide — plus the key DSM-5 questions clinicians in India ask.</p>
      <div class="actions">
        <button class="btn" data-act="next">Start the check <span aria-hidden="true">→</span></button>
        <span class="kbd-hint">press <b>Enter ↵</b></span>
      </div>
      <div class="meta-row"><span>⏱ 24 questions</span><span>🔒 Nothing leaves your device</span><span>⌨ Keyboard friendly</span></div>
      <div class="note"><strong>This is a screening tool, not a diagnosis.</strong> Only a qualified psychiatrist or clinical psychologist can diagnose ADHD after a full evaluation. If you're in distress right now, call <strong>Tele-MANAS 14416</strong> (free, 24×7, Govt. of India).</div>`;
  } else if(s.type==="interstitial"){
    html = `
      <h2 class="q-title">${s.title}</h2>
      <p class="lead">${s.body}</p>
      <div class="actions"><button class="btn" data-act="next">${s.cta} <span aria-hidden="true">→</span></button><span class="kbd-hint">press <b>Enter ↵</b></span></div>`;
  } else if(s.type==="choice" || s.type==="asrs"){
    const sel = answers[s.id];
    html = `
      <div class="eyebrow"><span class="num">${qNumber(cur)} →</span>${s.type==="asrs" ? `<span style="color:var(--muted);font-weight:500">${s.idx<6?"Part A":"Part B"}</span>`:""}</div>
      <h2 class="q-title" id="qt">${esc(s.t)}</h2>
      ${s.h?`<p class="q-hint">${esc(s.h)}</p>`:""}
      <div class="options" role="radiogroup" aria-labelledby="qt">
        ${s.opts.map((o,i)=>`<button class="opt ${sel===i?"selected":""}" role="radio" aria-checked="${sel===i}" data-i="${i}">
            <span class="key">${LETTERS[i]}</span><span class="lbl">${esc(o)}</span><span class="tick" aria-hidden="true">✓</span></button>`).join("")}
      </div>
      <div class="actions"><span class="kbd-hint">Press <b>${LETTERS.slice(0,s.opts.length).split("").join("</b> / <b>")}</b> to choose${s.type==="asrs"?" · or <b>1–5</b>":""}</span></div>`;
  } else if(s.type==="multi"){
    const sel = answers[s.id] || [];
    html = `
      <div class="eyebrow"><span class="num">${qNumber(cur)} →</span></div>
      <h2 class="q-title" id="qt">${esc(s.t)}</h2>
      <p class="q-hint">${esc(s.h)}</p>
      <div class="options" role="group" aria-labelledby="qt">
        ${s.opts.map((o,i)=>`<button class="opt ${sel.includes(i)?"selected":""}" role="checkbox" aria-checked="${sel.includes(i)}" data-m="${i}">
            <span class="key">${LETTERS[i]}</span><span class="lbl">${esc(o)}</span><span class="tick" aria-hidden="true">✓</span></button>`).join("")}
      </div>
      <div class="actions"><button class="btn" data-act="next" ${sel.length?"":"disabled"}>See my results <span aria-hidden="true">→</span></button><span class="kbd-hint">press <b>Enter ↵</b></span></div>`;
  } else if(s.type==="results"){
    html = renderResults();
  }
  card.innerHTML = html;
  card.className = "card " + (dir>0?"anim-in":"anim-in-rev");
  updateChrome();
  if(s.type==="results") animateResults();
  const focusEl = card.querySelector(".opt.selected, .btn, .opt");
  if(focusEl && s.type!=="results") focusEl.focus({preventScroll:true});
  window.scrollTo({top:0});
}

function updateChrome(){
  const s = steps[cur];
  const pct = s.type==="results" ? 100 : Math.round((cur/(steps.length-1))*100);
  document.getElementById("bar").style.width = pct+"%";
  const isQ = ["choice","asrs","multi"].includes(s.type);
  document.getElementById("counter").textContent = isQ ? `${qNumber(cur)} of ${totalQs}` : (s.type==="results"?"Your results":"");
  document.getElementById("prevBtn").disabled = cur===0 || s.type==="results";
  document.getElementById("nextBtn").disabled = !canAdvance() || s.type==="results";
  document.querySelector(".nav").style.display = s.type==="results" ? "none" : "";
}

function canAdvance(){
  const s = steps[cur];
  if(s.type==="choice"||s.type==="asrs") return answers[s.id]!==undefined;
  if(s.type==="multi") return (answers[s.id]||[]).length>0;
  return s.type!=="results";
}

function go(delta){
  if(busy) return;
  const target = cur+delta;
  if(target<0 || target>=steps.length) return;
  if(delta>0 && !canAdvance()) return;
  busy = true;
  card.className = "card " + (delta>0?"anim-out-up":"anim-out-down");
  setTimeout(()=>{ cur = target; render(delta); busy=false; }, 260);
}

function choose(i){
  const s = steps[cur];
  if(!(s.type==="choice"||s.type==="asrs") || i>=s.opts.length || busy) return;
  answers[s.id] = i;
  card.querySelectorAll(".opt").forEach((b,k)=>{ b.classList.toggle("selected",k===i); b.setAttribute("aria-checked",k===i); });
  const btn = card.querySelector(`.opt[data-i="${i}"]`); btn.classList.add("flash");
  updateChrome();
  window.bgHop && window.bgHop();
  setTimeout(()=>go(1), 380);
}

function toggleMulti(i){
  const s = steps[cur]; if(s.type!=="multi") return;
  let sel = answers[s.id] ? [...answers[s.id]] : [];
  const none = s.opts.length-1;
  if(i===none) sel = sel.includes(none) ? [] : [none];
  else { sel = sel.filter(x=>x!==none); sel = sel.includes(i) ? sel.filter(x=>x!==i) : [...sel,i]; }
  answers[s.id] = sel;
  card.querySelectorAll(".opt").forEach((b,k)=>{ const on = sel.includes(k); b.classList.toggle("selected",on); b.setAttribute("aria-checked",on); });
  card.querySelector('[data-act="next"]').disabled = !sel.length;
  updateChrome();
}

/* ---------- Scoring ---------- */
function score(){
  const vals = ASRS.map((_,i)=>answers["q"+(i+1)] ?? 0);
  const shaded = vals.map((v,i)=> LOW_THRESHOLD.has(i+1) ? v>=2 : v>=3);
  const partA = shaded.slice(0,6).filter(Boolean).length;
  const partB = shaded.slice(6).filter(Boolean).length;
  const INATT = [1,2,3,4,7,8,9,10,11], HYP = [5,6,12,13,14,15,16,17,18];
  const inatt = INATT.filter(n=>shaded[n-1]).length;
  const hyp = HYP.filter(n=>shaded[n-1]).length;
  const inattRaw = INATT.reduce((a,n)=>a+vals[n-1],0);
  const hypRaw = HYP.reduce((a,n)=>a+vals[n-1],0);
  const total = vals.reduce((a,b)=>a+b,0);

  let level;
  if(partA>=4) level="high";
  else if(partA===3 || inatt>=5 || hyp>=5) level="moderate";
  else level="low";

  let pattern = null;
  if(inatt>=5 && hyp>=5) pattern="combined";
  else if(inatt>=5) pattern="inattentive";
  else if(hyp>=5) pattern="hyperactive";

  return {vals,shaded,partA,partB,inatt,hyp,inattRaw,hypRaw,total,level,pattern};
}

const LEVELS = {
  high:{label:"Highly consistent with ADHD", color:"var(--high)",
    summary:"Your answers on the WHO screener are <strong>highly consistent with ADHD in adults</strong>. Four or more of the six Part A answers fell in the clinically significant range — the cut-off the ASRS authors identified as the best predictor of an ADHD diagnosis.",
    advice:"It's worth booking a proper evaluation with a psychiatrist or clinical psychologist."},
  moderate:{label:"Some signs worth exploring", color:"var(--mid)",
    summary:"Your answers show <strong>some features associated with ADHD</strong>, but they don't fully meet the screener's cut-off. This can happen with milder ADHD, with ADHD that's well-compensated, or with other conditions that affect attention.",
    advice:"If these difficulties bother you, a clinical conversation can help clarify what's going on."},
  low:{label:"ADHD unlikely on this screen", color:"var(--low)",
    summary:"Your answers are <strong>not consistent with ADHD</strong> on the WHO screener. Most people experience some of these things occasionally — that's normal.",
    advice:"If you still struggle with focus, sleep, stress, mood and workload are common causes worth looking at."}
};
const PATTERNS = {
  combined:"Your pattern resembles the <strong>combined presentation</strong> — both inattention and hyperactivity/impulsivity.",
  inattentive:"Your pattern resembles the <strong>predominantly inattentive presentation</strong> — sometimes called ADD — which is common in adults and frequently missed, especially in women.",
  hyperactive:"Your pattern resembles the <strong>predominantly hyperactive-impulsive presentation</strong>."
};

function renderResults(){
  const r = score();
  const L = LEVELS[r.level];
  const ctx = [];
  if(answers.age===1) ctx.push("<li><strong>You're under 18.</strong> The ASRS is designed for adults. For children and teens, a paediatrician, child psychiatrist or developmental paediatrician will use parent and teacher rating scales (such as the Vanderbilt or Conners scales) — please treat this result as a conversation starter only.</li>");
  if(answers.onset===3) ctx.push("<li><strong>Symptoms started after age 12.</strong> DSM-5 requires several symptoms before 12. Attention problems that begin in adulthood often have other causes (stress, sleep, mood, thyroid, medication) — a doctor can help sort this out.</li>");
  else if(answers.onset===2) ctx.push("<li><strong>Unsure about childhood?</strong> Old school report cards or asking a parent or sibling can help. Clinicians usually ask for this.</li>");
  else if(answers.onset!==undefined) ctx.push("<li><strong>Childhood onset ✓</strong> — DSM-5 requires several symptoms before age 12, which you've indicated.</li>");
  if(answers.settings===0) ctx.push("<li><strong>Only one area affected.</strong> DSM-5 requires symptoms in two or more settings. Difficulties limited to one place (e.g. only at work) may point to situational factors.</li>");
  else if(answers.settings!==undefined) ctx.push("<li><strong>Multiple settings ✓</strong> — symptoms showing up across areas of life is part of the diagnostic criteria.</li>");
  if(answers.impact===0) ctx.push("<li><strong>Little impact on your life.</strong> ADHD is diagnosed only when symptoms clearly interfere with functioning. Traits without impairment are not a disorder.</li>");
  else if(answers.impact>=2) ctx.push("<li><strong>Meaningful impact ✓</strong> — you've reported that these difficulties interfere with daily life, which is central to a diagnosis and a good reason to seek help.</li>");
  const other = (answers.other||[]).filter(i=>i!==5);
  const otherNames = ["sleep problems","low mood","anxiety","substance use","a medical condition such as thyroid disease"];
  if(other.length) ctx.push(`<li><strong>Overlapping factors:</strong> you mentioned ${other.map(i=>otherNames[i]).join(", ")}. These can mimic or coexist with ADHD — in fact, most adults with ADHD have at least one co-occurring condition. Mention them to your clinician.</li>`);

  const circ = 2*Math.PI*54;
  return `
    <div class="eyebrow">Your results</div>
    <div class="result-head">
      <div class="gauge" aria-label="Part A score ${r.partA} of 6">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="10"/>
        <circle id="gArc" cx="60" cy="60" r="54" fill="none" stroke="${L.color}" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="${circ}" stroke-dashoffset="${circ}" data-target="${circ*(1-r.partA/6)}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"/></svg>
        <div class="val"><div><b>${r.partA}/6</b><small>Screener score</small></div></div>
      </div>
      <div style="flex:1;min-width:220px">
        <span class="pill" style="background:${L.color}">${L.label}</span>
        <h1 style="font-size:clamp(28px,5vw,40px);margin-top:10px">${r.level==="high"?"It may be worth getting assessed.":r.level==="moderate"?"There's something worth a closer look.":"ADHD looks unlikely."}</h1>
      </div>
    </div>

    <div class="section">
      <h2>What this means</h2>
      <p>${L.summary}</p>
      ${r.pattern?`<p>${PATTERNS[r.pattern]}</p>`:""}
      <p>${L.advice}</p>
    </div>

    <div class="section">
      <h2>Your symptom profile</h2>
      <p style="color:var(--muted);font-size:15px">Number of symptoms in the clinically significant range, compared with the DSM-5 adult threshold of <strong>5</strong> per domain (the line).</p>
      <div class="bar-row"><div class="top"><span>Inattention</span><span>${r.inatt} / 9</span></div>
        <div class="bar"><i data-w="${r.inatt/9*100}" style="background:${r.inatt>=5?"var(--high)":"var(--accent)"}"></i><span class="mark" style="left:${5/9*100}%"></span></div></div>
      <div class="bar-row"><div class="top"><span>Hyperactivity / impulsivity</span><span>${r.hyp} / 9</span></div>
        <div class="bar"><i data-w="${r.hyp/9*100}" style="background:${r.hyp>=5?"var(--high)":"var(--accent)"}"></i><span class="mark" style="left:${5/9*100}%"></span></div></div>
      <div class="grid2" style="margin-top:16px">
        <div class="stat"><b>${r.partA}/6</b><span>Part A screener (4+ = highly consistent)</span></div>
        <div class="stat"><b>${r.total}/72</b><span>Total symptom-frequency score</span></div>
      </div>
    </div>

    ${ctx.length?`<div class="section"><h2>Context that matters</h2><ul>${ctx.join("")}</ul></div>`:""}

    <div class="section help">
      <h2>Getting assessed in India</h2>
      <ul>
        <li><strong>Who to see:</strong> a psychiatrist (MD/DNB Psychiatry) or an RCI-registered clinical psychologist. Only a psychiatrist (or other doctor) can prescribe medication if it's needed.</li>
        <li><strong>Where:</strong> psychiatry departments of government medical colleges and institutes such as NIMHANS (Bengaluru) and AIIMS (New Delhi) offer low-cost OPD consultations; many private hospitals and clinics also run adult ADHD assessments.</li>
        <li><strong>What to expect:</strong> a detailed interview about your childhood and current life, rating scales (often the full ASRS or DIVA-5), sometimes input from a family member, and checks for sleep, mood, anxiety and thyroid problems.</li>
        <li><strong>What to bring:</strong> this result, old school report cards if you have them, and a list of concrete examples of how symptoms affect you.</li>
        <li><strong>Need to talk now?</strong> Call <strong><a href="tel:14416">Tele-MANAS 14416</a></strong> or 1-800-891-4416 — the Government of India's free, 24×7 mental-health helpline, available in multiple Indian languages.</li>
      </ul>
    </div>

    <div class="res-actions">
      <button class="btn" data-act="copy">Copy summary</button>
      <button class="btn ghost" data-act="print">Save as PDF</button>
      <button class="btn ghost" data-act="restart">Retake</button>
    </div>

    <div class="note"><strong>Important:</strong> This self-check is for education and screening only. It cannot diagnose ADHD or rule it out. Many conditions — anxiety, depression, sleep disorders, thyroid problems, learning disabilities — can look like ADHD. Please consult a qualified professional before drawing conclusions or starting any treatment.</div>

    <div class="section sources">
      <h2 style="font-size:18px">Research this is based on</h2>
      <ul>
        <li>Kessler RC, Adler L, Ames M, et al. <em>The World Health Organization Adult ADHD Self-Report Scale (ASRS): a short screening scale for use in the general population.</em> Psychological Medicine, 2005;35(2):245–256.</li>
        <li>World Health Organization. <em>Adult ADHD Self-Report Scale (ASRS v1.1) Symptom Checklist</em> — scoring thresholds used here.</li>
        <li>American Psychiatric Association. <em>Diagnostic and Statistical Manual of Mental Disorders, 5th ed., Text Revision (DSM-5-TR)</em>, 2022 — ADHD criteria A–E (adult threshold of 5 symptoms, onset before 12, two or more settings, functional impairment).</li>
        <li>World Health Organization. <em>ICD-11</em>, code 6A05 — Attention deficit hyperactivity disorder.</li>
        <li>Indian Psychiatric Society — Clinical Practice Guidelines for the assessment and management of ADHD (Indian Journal of Psychiatry).</li>
        <li>Fayyad J, Sampson NA, Hwang I, et al. <em>The descriptive epidemiology of DSM-IV Adult ADHD in the WHO World Mental Health Surveys.</em> ADHD Attention Deficit and Hyperactivity Disorders, 2017;9(1):47–65.</li>
        <li>Ministry of Health &amp; Family Welfare, Govt. of India — <a href="https://telemanas.mohfw.gov.in" target="_blank" rel="noopener">Tele-MANAS</a>.</li>
      </ul>
    </div>`;
}

function animateResults(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const arc = document.getElementById("gArc"); if(arc) arc.style.strokeDashoffset = arc.dataset.target;
    card.querySelectorAll(".bar > i").forEach(b=>b.style.width = b.dataset.w+"%");
  }));
}

function summaryText(){
  const r = score(), L = LEVELS[r.level];
  return [
    "ADHD Self-Check (WHO ASRS v1.1) — screening result",
    `Result: ${L.label}`,
    `Part A screener: ${r.partA}/6 (4+ = highly consistent with adult ADHD)`,
    `Inattention symptoms (clinically significant): ${r.inatt}/9`,
    `Hyperactivity/impulsivity symptoms: ${r.hyp}/9`,
    `Total score: ${r.total}/72`,
    "",
    "Item responses:",
    ...ASRS.map((q,i)=>`${i+1}. ${FREQ[r.vals[i]]}${r.shaded[i]?" *":""}`),
    "(* = in clinically significant range)",
    "",
    "This is a screening tool, not a diagnosis."
  ].join("\n");
}

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

/* ---------- Events ---------- */
card.addEventListener("click",e=>{
  const opt = e.target.closest(".opt");
  if(opt){ if(opt.dataset.i!==undefined) choose(+opt.dataset.i); else toggleMulti(+opt.dataset.m); return; }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if(act==="next") go(1);
  else if(act==="print") window.print();
  else if(act==="restart"){ for(const k in answers) delete answers[k]; busy=false; cur=0; render(-1); }
  else if(act==="copy"){
    const txt = summaryText();
    (navigator.clipboard?.writeText(txt) || Promise.reject()).then(()=>toast("Summary copied"),()=>{
      const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
      try{document.execCommand("copy"); toast("Summary copied");}catch(_){toast("Couldn't copy");} ta.remove();
    });
  }
});
document.getElementById("prevBtn").onclick = ()=>go(-1);
document.getElementById("nextBtn").onclick = ()=>go(1);

document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const s = steps[cur]; if(s.type==="results") return;
  const k = e.key.toUpperCase();
  if(s.type==="choice"||s.type==="asrs"){
    let i = LETTERS.indexOf(k);
    if(s.type==="asrs" && /^[1-5]$/.test(k)) i = +k-1;
    if(i>=0 && i<s.opts.length && k.length===1){ e.preventDefault(); choose(i); return; }
  }
  if(s.type==="multi"){ const i = LETTERS.indexOf(k); if(i>=0 && i<s.opts.length && k.length===1){ e.preventDefault(); toggleMulti(i); return; } }
  if(e.key==="Enter" && !e.target.closest(".opt")){ e.preventDefault(); go(1); }
  else if(e.key==="ArrowUp" || (e.key==="Backspace" && e.target===document.body)){ e.preventDefault(); go(-1); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); go(1); }
});

/* Swipe/scroll-wheel feel like Typeform (wheel only on desktop) */
let wheelLock=0;
window.addEventListener("wheel",e=>{
  if(steps[cur].type==="results" || document.documentElement.scrollHeight>innerHeight+4) return;
  const now=Date.now(); if(now-wheelLock<700 || Math.abs(e.deltaY)<30) return;
  wheelLock=now; go(e.deltaY>0?1:-1);
},{passive:true});

render(1);
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
/* Interactive background: geometric shapes fall under gravity, collide, pile up,
   and are repelled by the pointer. Purely decorative — quiz works without it. */
(function(){
  if(typeof p5==="undefined") return;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TYPES = ["circle","square","triangle","pentagon","hexagon","ring"];
  const pointer = {x:-9999, y:-9999, active:false};

  addEventListener("pointermove", e=>{ pointer.x=e.clientX; pointer.y=e.clientY; pointer.active=true; }, {passive:true});
  addEventListener("pointerdown", e=>{ pointer.x=e.clientX; pointer.y=e.clientY; pointer.active=true; }, {passive:true});
  document.addEventListener("pointerleave", ()=>{ pointer.active=false; });
  addEventListener("pointerup", e=>{ if(e.pointerType!=="mouse") pointer.active=false; });

  new p5(p=>{
    let shapes = [], palette = [], W, H;
    const GRAVITY = 0.18, REPEL_R = 140, REPEL_F = 1.6, REST = 0.45, AIR = 0.995;

    function readPalette(){
      const cs = getComputedStyle(document.documentElement);
      palette = ["--accent","--low","--mid","--high","--accent"].map(v=>p.color(cs.getPropertyValue(v).trim()||"#3b5bdb"));
    }
    function target(){ return Math.round(Math.min(48, Math.max(18, (W*H)/26000))); }
    function make(yStart){
      const r = p.random(14, 34);
      return { x:p.random(r, W-r), y:yStart ?? p.random(-H, -r), vx:p.random(-.6,.6), vy:p.random(0,1),
               r, a:p.random(p.TWO_PI), va:p.random(-.02,.02), type:p.random(TYPES), c:p.floor(p.random(palette.length)) };
    }

    p.setup = ()=>{
      W = innerWidth; H = innerHeight;
      p.createCanvas(W, H).parent("bg");
      p.pixelDensity(Math.min(2, devicePixelRatio||1));
      readPalette();
      for(let i=0;i<target();i++) shapes.push(make(reduced ? p.random(H) : undefined));
      if(reduced){ p.noLoop(); p.redraw(); }
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ readPalette(); if(reduced) p.redraw(); });
    };

    p.windowResized = ()=>{
      W = innerWidth; H = innerHeight; p.resizeCanvas(W, H);
      const t = target();
      while(shapes.length < t) shapes.push(make());
      if(shapes.length > t) shapes.length = t;
      if(reduced) p.redraw();
    };

    // Little hop when the user answers a question
    window.bgHop = ()=>{ if(reduced) return; for(const s of shapes) if(s.y > H - s.r*3) { s.vy -= p.random(2.5, 5.5); s.vx += p.random(-1,1); s.va += p.random(-.05,.05); } };

    function step(){
      for(const s of shapes){
        s.vy += GRAVITY;
        if(pointer.active){
          const dx = s.x - pointer.x, dy = s.y - pointer.y, d = Math.hypot(dx,dy), R = REPEL_R + s.r;
          if(d < R && d > 0.01){
            const f = (1 - d/R) * REPEL_F;
            s.vx += dx/d * f; s.vy += dy/d * f; s.va += (dx>0?1:-1) * f * 0.01;
          }
        }
        s.vx *= AIR; s.vy *= AIR; s.va *= 0.98;
        s.x += s.vx; s.y += s.vy; s.a += s.va;

        if(s.x < s.r){ s.x = s.r; s.vx = Math.abs(s.vx)*REST; }
        if(s.x > W - s.r){ s.x = W - s.r; s.vx = -Math.abs(s.vx)*REST; }
        if(s.y > H - s.r){
          s.y = H - s.r; s.vy = -Math.abs(s.vy)*REST;
          if(Math.abs(s.vy) < .5) s.vy = 0;
          s.vx *= 0.96; s.va = s.va*0.8 + (s.vx/s.r)*0.2;   // roll along the floor
        }
      }
      // Pairwise collisions (n ≤ 48, so O(n²) is fine)
      for(let i=0;i<shapes.length;i++) for(let j=i+1;j<shapes.length;j++){
        const a = shapes[i], b = shapes[j];
        const dx = b.x-a.x, dy = b.y-a.y, min = (a.r+b.r)*0.92, d2 = dx*dx+dy*dy;
        if(d2 >= min*min || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx/d, ny = dy/d, overlap = (min-d)/2;
        a.x -= nx*overlap; a.y -= ny*overlap; b.x += nx*overlap; b.y += ny*overlap;
        const rel = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
        if(rel < 0){
          const imp = -(1+REST)*rel/2;
          a.vx -= imp*nx; a.vy -= imp*ny; b.vx += imp*nx; b.vy += imp*ny;
          a.va -= imp*0.01; b.va += imp*0.01;
        }
      }
    }

    function poly(n, r){ p.beginShape(); for(let k=0;k<n;k++){ const t = p.TWO_PI*k/n - p.HALF_PI; p.vertex(Math.cos(t)*r, Math.sin(t)*r); } p.endShape(p.CLOSE); }

    p.draw = ()=>{
      p.clear();
      if(!reduced) step();
      p.strokeWeight(1.6);
      for(const s of shapes){
        const c = palette[s.c];
        p.push(); p.translate(s.x, s.y); p.rotate(s.a);
        p.fill(p.red(c), p.green(c), p.blue(c), 30);
        p.stroke(p.red(c), p.green(c), p.blue(c), 90);
        switch(s.type){
          case "circle":   p.circle(0,0,s.r*2); break;
          case "ring":     p.noFill(); p.strokeWeight(s.r*0.35); p.stroke(p.red(c),p.green(c),p.blue(c),55); p.circle(0,0,s.r*1.6); break;
          case "square":   p.rectMode(p.CENTER); p.rect(0,0,s.r*1.5,s.r*1.5,4); break;
          case "triangle": poly(3, s.r*1.1); break;
          case "pentagon": poly(5, s.r); break;
          case "hexagon":  poly(6, s.r); break;
        }
        p.pop();
      }
    };
  });
})();
</script>
